version = 1
name = "kar"

[flow]
primary_task = "deploy"

[[tasks]]
name = "default"
command = """
cat <<'EOF'
Available tasks:
- setup          Ensure Cargo is installed and fetch dependencies.
- dev            Watch config and rebuild on changes.
- build          Test build with example config (dry run).
- signal-gate    Run scan + telemetry quality thresholds.
- signal-fix-plan Show exact mappings missing ids/signal metadata.
- run [args...]  Run kar CLI (passes CLI args through).
- deploy         Build kar binary and install it to ~/bin/kar.
EOF
"""
description = "List available tasks."

[[tasks]]
name = "setup"
command = """
set -euo pipefail
if ! command -v cargo >/dev/null 2>&1; then
  echo "Rust toolchain 'cargo' not found in PATH."
  echo "Install it via https://www.rust-lang.org/tools/install"
  exit 1
fi
cargo --version >/dev/null
repo_root="$PWD"
export CARGO_HOME="${CARGO_HOME:-$repo_root/.cargo_home}"
export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$repo_root/target}"
mkdir -p "$CARGO_HOME"
mkdir -p "$CARGO_TARGET_DIR"
if ! cargo fetch --manifest-path "$repo_root/Cargo.toml" >/dev/null; then
  echo "Warning: unable to download Cargo dependencies; try again once network access is available."
fi
echo "you are setup"
"""
description = "Ensure Cargo is installed and fetch dependencies."

[[tasks]]
name = "dev"
command = """
set -euo pipefail
repo_root="$PWD"
export CARGO_HOME="${CARGO_HOME:-$repo_root/.cargo_home}"
export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$repo_root/target}"
mkdir -p "$CARGO_HOME"
mkdir -p "$CARGO_TARGET_DIR"
cargo run --manifest-path "$repo_root/Cargo.toml" -- watch "$@"
"""
description = "Watch config and rebuild on changes."

[[tasks]]
name = "build"
command = """
set -euo pipefail
repo_root="$PWD"
export CARGO_HOME="${CARGO_HOME:-$repo_root/.cargo_home}"
export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$repo_root/target}"
mkdir -p "$CARGO_HOME"
mkdir -p "$CARGO_TARGET_DIR"
cargo run --manifest-path "$repo_root/Cargo.toml" -- build --dry-run -c examples/nikita-config.ts
"""
description = "Test build with nikita-config.ts (dry run)."

[[tasks]]
name = "signal-scan"
command = """
set -euo pipefail
out="${KAR_SIGNAL_SCAN_OUT:-$HOME/.local/state/kar/signal-scan.json}"
python3 scripts/scan_config_signals.py \
  "$HOME/.config/kar/config.ts" \
  "/Users/nikiv/config/i/kar/config.ts" \
  "examples/config.ts" \
  "examples/simple/config.ts" \
  "examples/complex/config.ts" \
  --output "$out"
echo "report: $out"
"""
description = "Scan Kar configs for keyboard telemetry readiness (actions/metadata/coverage)."

[[tasks]]
name = "signal-scan-report"
command = """
set -euo pipefail
cat "${KAR_SIGNAL_SCAN_OUT:-$HOME/.local/state/kar/signal-scan.json}"
"""
description = "Show latest Kar signal scan report JSON."

[[tasks]]
name = "signal-gate"
command = """
set -euo pipefail
out="${KAR_SIGNAL_SCAN_OUT:-$HOME/.local/state/kar/signal-scan.json}"
python3 scripts/scan_config_signals.py \
  "$HOME/.config/kar/config.ts" \
  "/Users/nikiv/config/i/kar/config.ts" \
  "examples/config.ts" \
  "examples/simple/config.ts" \
  "examples/complex/config.ts" \
  --output "$out"
python3 scripts/signal_gate.py \
  --report "$out" \
  --min-observable-action-share "${KAR_GATE_MIN_OBSERVABLE_ACTION_SHARE:-0.70}" \
  --max-shell-action-share "${KAR_GATE_MAX_SHELL_ACTION_SHARE:-0.02}" \
  --min-send-user-command-id-coverage "${KAR_GATE_MIN_SEND_ID_COVERAGE:-0.50}" \
  --min-send-user-command-signal-coverage "${KAR_GATE_MIN_SEND_SIGNAL_COVERAGE:-0.50}" \
  --min-send-user-command-intent-coverage "${KAR_GATE_MIN_SEND_INTENT_COVERAGE:-0.50}"
"""
description = "Run signal scan and enforce telemetry-readiness thresholds."

[[tasks]]
name = "signal-fix-plan"
command = """
set -euo pipefail
python3 scripts/signal_fix_plan.py \
  "$HOME/.config/kar/config.ts" \
  "/Users/nikiv/config/i/kar/config.ts" \
  "examples/config.ts" \
  "examples/simple/config.ts" \
  "examples/complex/config.ts" \
  --limit "${KAR_SIGNAL_FIX_PLAN_LIMIT:-80}"
"""
description = "Show specific send_user_command mappings missing id/signal/intent metadata."

[[tasks]]
name = "run"
command = """
set -euo pipefail
repo_root="$PWD"
export CARGO_HOME="${CARGO_HOME:-$repo_root/.cargo_home}"
export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$repo_root/target}"
mkdir -p "$CARGO_HOME"
mkdir -p "$CARGO_TARGET_DIR"
cargo run --manifest-path "$repo_root/Cargo.toml" -- "$@"
"""
description = "Run kar CLI (passes CLI args through)."

[[tasks]]
name = "deploy"
command = """
set -euo pipefail
repo_root="$PWD"
bin_dir="$HOME/bin"
config_dir="$HOME/.config/kar"
bin_artifact="kar"
bin_name="kar"
mkdir -p "$bin_dir"
mkdir -p "$config_dir"

export CARGO_HOME="${CARGO_HOME:-$repo_root/.cargo_home}"
export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-$repo_root/target}"
mkdir -p "$CARGO_HOME"
mkdir -p "$CARGO_TARGET_DIR"

cargo build --manifest-path "$repo_root/Cargo.toml" --release
cp "$CARGO_TARGET_DIR/release/$bin_artifact" "$bin_dir/$bin_name"
chmod 755 "$bin_dir/$bin_name"
cp -r "$repo_root/types" "$config_dir/types"
echo "Installed CLI to $bin_dir/$bin_name"
echo "Installed types to $config_dir/types"
"""
description = "Build kar binary and install it to ~/bin/kar."
